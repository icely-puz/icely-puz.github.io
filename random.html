        ];

        // Mix the day before choosing so consecutive days do not produce
        // nearly identical values from the random generator.
        function seededRandom(seed) {
            let s = seed >>> 0;
            return function() {
                let t = s += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // Use UTC so every visitor gets the same toad for the same calendar day.
        const day = Math.floor(Date.now() / 86400000);
        const rng = seededRandom(day);
        const chosen = files[Math.floor(rng() * files.length)];
        const path = new URL('toads/' + chosen, document.baseURI).href;

        const media = chosen.endsWith('.mp4')
            ? document.createElement('video')
            : document.createElement('img');
        media.src = path;
        media.style.maxWidth = '100vw';
        media.style.maxHeight = '100vh';
        if (chosen.endsWith('.mp4')) {
            media.controls = true;
            media.autoplay = true;
            media.muted = true;
            media.loop = true;
        } else {
            media.alt = 'Random toad of the day';
        }
        document.body.appendChild(media);

        // Rotate automatically if the page stays open across midnight UTC.
        const nextDay = (day + 1) * 86400000;
        setTimeout(() => window.location.reload(), nextDay - Date.now());
